name: PR

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only by default; a job that needs more says so itself.
permissions:
  contents: read

# lint, test and test/e2e are the checks every Go repository requires. test and test/e2e run on the
# 3-OS x Go 1.26/1.27 matrix; a matrix leg reports "name (leg)", so each matrix has a fan-in job
# with the required name that fails unless every leg succeeded (a skipped or cancelled leg fails it
# too). The Windows legs run the Makefile target's go commands directly rather than depend on make
# there: keep them in step with the Makefile. No job needs git auth after checkout, and lint runs
# third-party tool code, so no checkout keeps the job token in .git/config.
jobs:
  # gofmt, go vet, staticcheck, govulncheck, gosec and the go-licenses allowlist, with the tools
  # pinned in tools/go.mod (go 1.27.3, which is why this job runs on that Go and not the matrix).
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - run: make lint

  # Module hygiene and the unit race suite; no scanii-cli server.
  go-test:
    name: unit (Go ${{ matrix.go }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.26', '1.27']
    steps:
      # Windows runners check out with core.autocrlf=true, so go mod tidy -diff would report
      # every line of go.sum as changed.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          # the SDK has no go.sum; the tools module (tidy-checked here) is what there is to cache
          cache-dependency-path: tools/go.sum
      - name: make test/ci
        if: runner.os != 'Windows'
        run: make test/ci
      - name: make test/ci (its commands)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          go mod tidy -diff
          go mod verify
          GOTOOLCHAIN=auto go -C tools mod tidy -diff
          go test -race -vet=off ./...

  test:
    needs: go-test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: '[ "${{ needs.go-test.result }}" = success ]'

  # The integration tests (build tag integration) against a scanii-cli server on localhost:4000.
  go-e2e:
    name: e2e (Go ${{ matrix.go }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.26', '1.27']
    steps:
      # Windows runners check out with core.autocrlf=true, so go mod tidy -diff would report
      # every line of go.sum as changed.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false # nothing to cache: the SDK has no dependencies
      - name: Setup scanii-cli
        uses: scanii/setup-cli-action@cac27c2ec1ff8056480b54a7d3207cf023783e20 # v1.0.3
      - name: make test/e2e
        if: runner.os != 'Windows'
        run: make test/e2e
      - name: make test/e2e (its commands)
        if: runner.os == 'Windows'
        shell: bash
        run: go test -race -vet=off -count=1 -tags=integration ./...

  e2e:
    name: test/e2e
    needs: go-e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: '[ "${{ needs.go-e2e.result }}" = success ]'
